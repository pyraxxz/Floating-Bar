name: Windows CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate PowerShell installer scripts
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "installer/Install-FloatingBar.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "installer/Uninstall-FloatingBar.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

      - name: Run regression tests
        shell: pwsh
        run: |
          & python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath ci-test-output.txt
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows executable
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py

      - name: Upload regression output after a failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-test-output-${{ github.run_number }}
          path: ci-test-output.txt
          if-no-files-found: ignore
          retention-days: 7
