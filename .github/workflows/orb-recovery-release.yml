name: Publish Floating Bar v0.1.25

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish minimized background orb v0.1.25')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Verify dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify application package
        shell: pwsh
        run: |
          python -m compileall -q floatingbar
          python -c "import floatingbar; assert floatingbar.__version__ == '0.1.25'; print('Floating Bar version:', floatingbar.__version__)"

      - name: Build Windows executable
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py


      - name: Calculate SHA256
        id: digest
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/FloatingBar.exe -Algorithm SHA256).Hash
          "$hash  FloatingBar.exe" | Out-File dist/FloatingBar.exe.sha256 -Encoding ascii
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.25
          target_commitish: ${{ github.sha }}
          name: Floating Bar v0.1.25 — Foreground-Locked Background Send
          body: |
            This release keeps the compact single-purpose orb and extends the background path to minimized Telegram windows.

            Click the orb, type, press Enter, and the message is injected into the currently open Telegram chat without activating Telegram. When Telegram is minimized, it is temporarily restored with a non-activating Windows show state and returned to minimized state after the send.

            Windows build tested by the release workflow. SHA256: ${{ steps.digest.outputs.hash }}
          generate_release_notes: true
          files: |
            dist/FloatingBar.exe
            dist/FloatingBar.exe.sha256
