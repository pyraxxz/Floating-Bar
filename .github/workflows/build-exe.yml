name: Publish Windows release

# Milestone releases only. The normal Windows CI runs on main; this workflow
# publishes a downloadable EXE only when an explicit v* tag is pushed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example v0.2.0)"
        required: true
        type: string

concurrency:
  group: floatingbar-release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH; got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Check tag and source version
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;

            const tagRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tag}`,
            });
            const tagSha = tagRef.data.object.sha;

            const packageFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'floatingbar/__init__.py',
              ref: tag,
            });
            const decoded = Buffer.from(packageFile.data.content, 'base64').toString('utf8');
            const match = decoded.match(/__version__\s*=\s*"([^"]+)"/);
            if (!match) throw new Error(`Could not determine package version from ${tag}.`);
            const version = match[1];
            if (`v${version}` !== tag) {
              throw new Error(`Tag ${tag} does not match package version ${version}.`);
            }

            core.setOutput('sha', tagSha);
            core.setOutput('version', version);
            core.info(`Publishing ${tag} from ${tagSha}.`);

            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists (${release.data.id}); skipping rebuild.`);
              core.setOutput('publish', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
            }

      - name: Set up Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pip install -r requirements.txt pyinstaller

      - name: Compile Python sources
        if: steps.release.outputs.publish == 'true'
        run: python -m compileall -q .

      - name: Run regression tests
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        if: steps.release.outputs.publish == 'true'
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py

      - name: Confirm tag source before publication
        if: steps.release.outputs.publish == 'true'
        id: confirm
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const expected = process.env.EXPECTED_SHA;
            const { owner, repo } = context.repo;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (ref.data.object.sha !== expected) {
              throw new Error(`Release tag ${tag} moved during build from ${expected} to ${ref.data.object.sha}.`);
            }
            core.setOutput('current', 'true');

      - name: Calculate SHA256
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        id: sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/FloatingBar.exe -Algorithm SHA256).Hash
          "$hash  FloatingBar.exe" | Out-File dist/FloatingBar.exe.sha256 -Encoding ascii
          "hash=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "FloatingBar.exe SHA256: $hash"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Floating Bar ${{ steps.tag.outputs.tag }}
          body: "Milestone Windows build for Floating Bar ${{ steps.tag.outputs.tag }}. SHA256: ${{ steps.sha256.outputs.hash }}. Source validated by the Windows CI suite before publication."
          files: |
            dist/FloatingBar.exe
            dist/FloatingBar.exe.sha256
          generate_release_notes: true

      - name: Upload build artifact
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBar-win64-${{ steps.release.outputs.version }}
          path: |
            dist/FloatingBar.exe
            dist/FloatingBar.exe.sha256
