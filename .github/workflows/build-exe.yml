name: Publish Windows release

# Milestone releases only. The normal Windows CI runs on main; this workflow
# publishes a downloadable EXE only when an explicit v* tag is pushed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish (for example v0.2.0)"
        required: true
        type: string

concurrency:
  group: floatingbar-release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH; got '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Lock workspace to release tag
        id: source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
          git checkout --detach "refs/tags/$env:RELEASE_TAG"
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $sha) {
            throw "Could not resolve the release tag commit in the build workspace."
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Release workspace locked to commit $sha"

      - name: Check tag, source commit, and package version
        id: release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          CHECKED_OUT_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const checkedOutSha = process.env.CHECKED_OUT_SHA;
            const { owner, repo } = context.repo;

            const commit = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: tag,
            });
            const tagSha = commit.data.sha;
            if (tagSha !== checkedOutSha) {
              throw new Error(`Workspace commit ${checkedOutSha} does not match tag ${tag} commit ${tagSha}.`);
            }

            const packageFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'floatingbar/__init__.py',
              ref: tag,
            });
            const decoded = Buffer.from(packageFile.data.content, 'base64').toString('utf8');
            const match = decoded.match(/__version__\s*=\s*"([^"]+)"/);
            if (!match) throw new Error(`Could not determine package version from ${tag}.`);
            const version = match[1];
            if (`v${version}` !== tag) {
              throw new Error(`Tag ${tag} does not match package version ${version}.`);
            }

            core.setOutput('sha', tagSha);
            core.setOutput('version', version);
            core.info(`Publishing ${tag} from ${tagSha}.`);

            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists (${release.data.id}); skipping rebuild.`);
              core.setOutput('publish', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('publish', 'true');
            }

      - name: Validate completed real-Windows smoke report
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if (-not (Test-Path -LiteralPath "smoke-report.json")) {
            throw "Release source does not contain smoke-report.json. Run 'python tools/smoke_report.py --init smoke-report.json' on the Windows validation machine, complete the applicable cases, validate with --require-complete, and commit the report before tagging."
          }
          python tools/smoke_report.py --validate smoke-report.json --require-complete

          try {
            $report = Get-Content -LiteralPath "smoke-report.json" -Raw | ConvertFrom-Json
            $sourceCommit = [string]$report.environment.source_commit
          } catch {
            throw "Could not read environment.source_commit from smoke-report.json."
          }
          if ($sourceCommit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "smoke-report.json contains no valid environment.source_commit."
          }
          git cat-file -e "$sourceCommit^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "The smoke report source commit $sourceCommit is not present in the release workspace."
          }
          git merge-base --is-ancestor $sourceCommit $env:EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "The smoke report was generated from $sourceCommit, which is not an ancestor of the tagged release source $env:EXPECTED_SHA."
          }
          Write-Host "Smoke report source $sourceCommit is an ancestor of release source $env:EXPECTED_SHA"

      - name: Set up Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pip install -r requirements.txt pyinstaller

      - name: Compile Python sources
        if: steps.release.outputs.publish == 'true'
        run: python -m compileall -q .

      - name: Run regression tests
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v

      - name: Validate PowerShell installer scripts
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "installer/Install-FloatingBar.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "installer/Uninstall-FloatingBar.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

      - name: Build Windows executable
        if: steps.release.outputs.publish == 'true'
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py

      - name: Stage installer scripts
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          Copy-Item -LiteralPath installer/Install-FloatingBar.ps1 -Destination dist/Install-FloatingBar.ps1 -Force
          Copy-Item -LiteralPath installer/Uninstall-FloatingBar.ps1 -Destination dist/Uninstall-FloatingBar.ps1 -Force

      - name: Confirm tag source before publication
        if: steps.release.outputs.publish == 'true'
        id: confirm
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git fetch origin "refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
          $workspaceSha = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}").Trim()
          if ($workspaceSha -ne $env:EXPECTED_SHA) {
            throw "Workspace source moved during build from $env:EXPECTED_SHA to $workspaceSha."
          }
          if ($tagSha -ne $env:EXPECTED_SHA) {
            throw "Release tag $env:RELEASE_TAG moved during build from $env:EXPECTED_SHA to $tagSha."
          }
          "current=true" >> $env:GITHUB_OUTPUT
          Write-Host "Release source remained pinned to $env:EXPECTED_SHA"

      - name: Calculate SHA256
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        id: sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/FloatingBar.exe -Algorithm SHA256).Hash
          "$hash  FloatingBar.exe" | Out-File dist/FloatingBar.exe.sha256 -Encoding ascii
          "hash=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "FloatingBar.exe SHA256: $hash"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Floating Bar ${{ steps.tag.outputs.tag }}
          body: "Milestone Windows build for Floating Bar ${{ steps.tag.outputs.tag }}. SHA256: ${{ steps.sha256.outputs.hash }}. Source validated and pinned to the tag commit before publication."
          files: |
            dist/FloatingBar.exe
            dist/FloatingBar.exe.sha256
            dist/Install-FloatingBar.ps1
            dist/Uninstall-FloatingBar.ps1
          generate_release_notes: true

      - name: Upload build artifact
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBar-win64-${{ steps.release.outputs.version }}
          path: |
            dist/FloatingBar.exe
            dist/FloatingBar.exe.sha256
