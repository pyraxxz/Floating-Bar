name: Publish Windows release

# Release publication intentionally runs from a user-created version tag.
# The main branch is validated by ci.yml first. This keeps release creation on
# the tag-triggered path that GitHub permits for this repository and avoids the
# 403 encountered when a branch-triggered workflow tried to create a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate package version
        shell: pwsh
        run: |
          $match = Select-String -Path floatingbar/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not determine Floating Bar version." }
          $version = $match.Matches[0].Groups[1].Value
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected."
          }
          Write-Host "Validated release tag: $env:GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Floating Bar ${{ github.ref_name }}
          files: dist/FloatingBar.exe
          generate_release_notes: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBar-win64-${{ github.ref_name }}
          path: dist/FloatingBar.exe
