name: Publish Windows release

# A new package version on main is validated, built, tagged, and published.
# Existing releases are never rebuilt. A queued job also refuses to publish
# if main has moved on, so a stale build cannot become the current release.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: floatingbar-release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path floatingbar/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not determine Floating Bar version." }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Floating Bar version: $version"

      - name: Check release state and current main
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists; skipping rebuild.`);
              core.setOutput('publish', 'false');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const branch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });
            const mainSha = branch.data.commit.sha;
            if (mainSha !== context.sha) {
              core.info(
                `main moved to ${mainSha} while this run targets ${context.sha}; ` +
                `skipping this stale queued release job.`
              );
              core.setOutput('publish', 'false');
              return;
            }

            core.info(`Release ${tag} does not exist and ${context.sha} is current main.`);
            core.setOutput('publish', 'true');

      - name: Set up Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pip install -r requirements.txt pyinstaller

      - name: Compile Python sources
        if: steps.release.outputs.publish == 'true'
        run: python -m compileall -q .

      - name: Run regression tests
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        if: steps.release.outputs.publish == 'true'
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py

      - name: Reconfirm current main before tag
        if: steps.release.outputs.publish == 'true'
        id: confirm
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = branch.data.commit.sha;
            if (mainSha !== context.sha) {
              core.info(`main moved to ${mainSha} during build; refusing to tag stale commit ${context.sha}.`);
              core.setOutput('current', 'false');
              return;
            }
            core.setOutput('current', 'true');

      - name: Create or repair release tag
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            let tagSha = null;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagSha = ref.data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagSha && tagSha !== context.sha) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha: context.sha,
                force: true,
              });
              core.info(`Repointed ${tag} to validated commit ${context.sha}.`);
            } else if (!tagSha) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created ${tag} at validated commit ${context.sha}.`);
            } else {
              core.info(`Tag ${tag} already points to validated commit ${context.sha}.`);
            }

      - name: Calculate SHA256
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        id: sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/FloatingBar.exe -Algorithm SHA256).Hash
          "$hash  FloatingBar.exe" | Out-File dist/FloatingBar.exe.sha256 -Encoding ascii
          "hash=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "FloatingBar.exe SHA256: $hash"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Floating Bar ${{ steps.version.outputs.tag }}
          body: "Automated Windows build for Floating Bar ${{ steps.version.outputs.tag }}. SHA256: ${{ steps.sha256.outputs.hash }}. Source validated by the Windows CI suite before publication."
          files: |
            dist/FloatingBar.exe
            dist/FloatingBar.exe.sha256
          generate_release_notes: false

      - name: Upload build artifact
        if: steps.release.outputs.publish == 'true' && steps.confirm.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBar-win64-${{ steps.version.outputs.version }}
          path: |
            dist/FloatingBar.exe
            dist/FloatingBar.exe.sha256
