name: Publish Windows release

# A new package version on main is validated, built, tagged, and published.
# Existing releases are never rebuilt. The tag is created/repointed only after
# validation and the Windows executable build succeed.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: floatingbar-release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path floatingbar/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not determine Floating Bar version." }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Floating Bar version: $version"

      - name: Check release state
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists; skipping rebuild.`);
              core.setOutput('publish', 'false');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.info(`Release ${tag} does not exist; validation/build required.`);
            core.setOutput('publish', 'true');

      - name: Set up Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pip install -r requirements.txt pyinstaller

      - name: Compile Python sources
        if: steps.release.outputs.publish == 'true'
        run: python -m compileall -q .

      - name: Run regression tests
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        if: steps.release.outputs.publish == 'true'
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py

      - name: Create or repair release tag
        if: steps.release.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            let tagSha = null;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagSha = ref.data.object.sha;
              core.info(`Tag ${tag} currently points to ${tagSha}.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagSha && tagSha !== context.sha) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: `tags/${tag}`,
                sha: context.sha,
                force: true,
              });
              core.info(`Repointed ${tag} to validated commit ${context.sha}.`);
            } else if (!tagSha) {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created ${tag} at validated commit ${context.sha}.`);
            } else {
              core.info(`Tag ${tag} already points to validated commit ${context.sha}.`);
            }

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Floating Bar ${{ steps.version.outputs.tag }}
          body: "Automated Windows build for Floating Bar ${{ steps.version.outputs.tag }}. Source validated by the Windows CI suite before publication."
          files: dist/FloatingBar.exe
          generate_release_notes: false

      - name: Upload build artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBar-win64-${{ steps.version.outputs.version }}
          path: dist/FloatingBar.exe
