name: Publish Windows release

# Every push to main is checked against the package version. When that version
# has not been released yet, this workflow creates the matching vX.Y.Z tag,
# builds the Windows executable, and publishes it to a GitHub Release.
# This removes the previous deployment gap where main could be newer than the
# latest published release simply because nobody had created the tag yet.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path floatingbar/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not determine Floating Bar version." }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Floating Bar version: $version"

      - name: Ensure release tag exists
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            let tagExists = true;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Tag ${tag} already exists.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              tagExists = false;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created tag ${tag} at ${context.sha}.`);
            }

            let releaseExists = true;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists; nothing to publish.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              releaseExists = false;
              core.info(`Release ${tag} does not exist; publishing it now.`);
            }

            core.setOutput('publish', (!releaseExists).toString());
            core.setOutput('tag_created', (!tagExists).toString());

      - name: Set up Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pip install -r requirements.txt pyinstaller

      - name: Compile Python sources
        if: steps.release.outputs.publish == 'true'
        run: python -m compileall -q .

      - name: Run regression tests
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        if: steps.release.outputs.publish == 'true'
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Floating Bar ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/FloatingBar.exe
          generate_release_notes: true

      - name: Upload build artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBar-win64-${{ steps.version.outputs.version }}
          path: dist/FloatingBar.exe
