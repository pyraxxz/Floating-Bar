name: Publish Windows release

# Every push to main is checked against the package version. A version is
# published only after the Windows build and regression suite pass. Existing
# releases are left untouched. The version tag is created only after the build
# succeeds, so a failed build can never leave a misleading release tag behind.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path floatingbar/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          if (-not $match) { throw "Could not determine Floating Bar version." }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Floating Bar version: $version"

      - name: Check release state
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            let tagSha = null;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              tagSha = ref.data.object.sha;
              core.info(`Tag ${tag} exists at ${tagSha}.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(`Tag ${tag} does not exist yet.`);
            }

            let releaseExists = false;
            try {
              await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              releaseExists = true;
              core.info(`Release ${tag} already exists; skipping rebuild.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(`Release ${tag} does not exist.`);
            }

            if (releaseExists) {
              core.setOutput('publish', 'false');
              return;
            }

            if (tagSha && tagSha !== context.sha) {
              throw new Error(
                `Tag ${tag} points to ${tagSha}, not ${context.sha}. ` +
                `Refusing to attach a new release to an older commit; bump the package version.`
              );
            }

            core.setOutput('publish', 'true');
            core.info(`Version ${tag} is ready for validation and publication.`);

      - name: Set up Python
        if: steps.release.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: pip install -r requirements.txt pyinstaller

      - name: Compile Python sources
        if: steps.release.outputs.publish == 'true'
        run: python -m compileall -q .

      - name: Run regression tests
        if: steps.release.outputs.publish == 'true'
        run: python -m unittest discover -s tests -v

      - name: Build Windows executable
        if: steps.release.outputs.publish == 'true'
        run: pyinstaller --onefile --noconsole --name FloatingBar main.py

      - name: Create release tag
        if: steps.release.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            try {
              await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Tag ${tag} appeared during validation; reusing it.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Created tag ${tag} at validated commit ${context.sha}.`);
            }

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Floating Bar ${{ steps.version.outputs.tag }}
          files: dist/FloatingBar.exe
          generate_release_notes: true

      - name: Upload build artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FloatingBar-win64-${{ steps.version.outputs.version }}
          path: dist/FloatingBar.exe
